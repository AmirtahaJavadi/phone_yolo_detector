# docker-compose.yml (CPU version)
# Mounts the project folder as /ros2_ws/src/phone_yolo_detector inside the container.
# Uses host networking for ROS 2 DDS discovery AND for reaching the phone over Wi-Fi.

services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: phone-yolo-humble:latest
    container_name: phone-yolo
    network_mode: host               # Required: DDS multicast + phone reachable
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - YOLO_CONFIG_DIR=/root/.config/Ultralytics
    volumes:
      # Mount the whole project folder as a ROS package under src/
      - .:/ros2_ws/src/phone_yolo_detector:rw
      # X11 socket so rqt_image_view can open a window on the host
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Cache Ultralytics model weights across container restarts
      - yolo-cache:/root/.config/Ultralytics
      # ROS log directory
      - ros-log:/root/.ros
    stdin_open: true                 # docker run -i
    tty: true                        # docker run -t
    command: bash

volumes:
  yolo-cache:
  ros-log:
